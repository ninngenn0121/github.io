<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D FPS - 共有練習場＆1vs1バトル</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; overflow-y: auto; padding: 20px; }
        .menu-box { background: #222; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #555; max-width: 480px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .menu-section { margin-bottom: 12px; padding: 12px; background: #333; border-radius: 8px; text-align: left; }
        .menu-section h3 { margin: 0 0 8px 0; font-size: 16px; color: #f1c40f; text-align: center; }
        input[type="text"] { padding: 10px; margin: 5px 0; border-radius: 4px; border: 1px solid #666; width: 100%; text-align: center; font-size: 15px; background: #111; color: #fff; touch-action: auto; }
        
        .btn { padding: 10px 16px; margin: 4px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; font-size: 14px; color: white; background: #3498db; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-green { background: #2ecc71; }
        .btn-purple { background: #9b59b6; }
        .btn-orange { background: #e67e22; }
        .btn-full { width: 100%; display: block; margin: 6px 0; font-size: 15px; padding: 12px; }

        .flex-row { display: flex; gap: 8px; justify-content: center; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 100; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: red; border-radius: 50%; transform: translate(-50%, -50%); transition: transform 0.05s, background 0.1s; pointer-events: none; }
        .shooting { transform: translate(-50%, -50%) scale(2) !important; background: yellow !important;} 
        .hit-marker { transform: translate(-50%, -50%) scale(2.5) !important; background: #2ecc71 !important; }

        #status-top { position: absolute; top: 15px; left: 15px; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        #status-bottom { position: absolute; bottom: 15px; left: 15px; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 2px #000; }
        #weapon-display { position: absolute; bottom: 45px; right: 15px; font-size: 18px; font-weight: bold; color: #f39c12; text-shadow: 2px 2px 2px #000; }
        #ammo-display { position: absolute; bottom: 15px; right: 15px; font-size: 26px; font-weight: bold; text-shadow: 2px 2px 2px #000; }
        .reloading { color: #f1c40f; }

        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: red; opacity: 0; transition: opacity 0.1s; pointer-events: none;}
        #flash-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: white; opacity: 0; transition: opacity 0.05s; pointer-events: none;}
        #target-hit-msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; font-weight: bold; color: #f39c12; text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity 0.2s; pointer-events: none; }

        /* 頭上ネームタグ＆対戦ボタンコンテナ */
        .nametag-container { position: absolute; pointer-events: auto; display: none; transform: translate(-50%, -100%); text-align: center; z-index: 200; }
        .nametag-box { background: rgba(0,0,0,0.75); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); font-size: 12px; font-weight: bold; white-space: nowrap; color: #fff; }
        .nametag-id { font-size: 10px; color: #f1c40f; margin-top: 2px; }
        .btn-challenge { margin-top: 4px; padding: 4px 8px; font-size: 11px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-challenge:hover { background: #c0392b; }

        /* スマホ用タッチ操作レイアウト */
        #mobile-look-area { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; z-index: 105; display: none; }
        #joystick-container { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: none; pointer-events: auto; z-index: 110; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; }

        .mobile-btn { position: absolute; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.9); border-radius: 50%; width: 60px; height: 60px; display: none; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; font-size: 15px; color: white; z-index: 120; }
        .mobile-btn:active { background: rgba(255,255,255,0.7); }
        #btn-shoot { bottom: 30px; right: 30px; width: 85px; height: 85px; background: rgba(231, 76, 60, 0.7); border-color: #e74c3c; font-size: 20px; }
        #btn-jump { bottom: 130px; right: 30px; }
        #btn-crouch { bottom: 30px; right: 130px; }
        #btn-scope { bottom: 130px; right: 130px; }
        #btn-reload { bottom: 210px; right: 30px; width: 50px; height: 50px; font-size: 13px; }
        #btn-weapon { top: 15px; right: 15px; width: 80px; height: 40px; border-radius: 8px; background: rgba(243, 156, 18, 0.7); border-color: #f39c12; font-size: 13px; }
    </style>
</head>
<body>

<div id="menu">
    <div class="menu-box">
        <h2 style="margin:0 0 10px 0; color:#3498db;">3D FPS マルチロビー</h2>
        
        <div class="menu-section">
            <h3>プレイヤー設定</h3>
            <input type="text" id="player-name-input" placeholder="名前を入力" value="Player">
            <div style="font-size:12px; color:#aaa; margin-top:4px; text-align:center;">あなたのID: <span id="my-id" style="color:#f1c40f; font-weight:bold;">生成中...</span></div>
        </div>

        <!-- 1. ソロ練習場 -->
        <div class="menu-section">
            <h3>1. 一人用練習場</h3>
            <div class="flex-row">
                <button class="btn btn-green" style="flex:1" onclick="startPracticeMode(false)">PCで練習</button>
                <button class="btn btn-green" style="flex:1" onclick="startPracticeMode(true)">スマホで練習</button>
            </div>
        </div>

        <!-- 2. みんなの共有練習場 -->
        <div class="menu-section">
            <h3>2. みんなの練習場 (集まる・的当て・対戦)</h3>
            <div style="font-size:12px; color:#ccc; margin-bottom:6px; text-align:center;">誰かが作った練習場に入るか、自分で部屋を作成します</div>
            <input type="text" id="room-id-input" placeholder="入る練習場の部屋ID (作成者のID)">
            <div class="flex-row">
                <button class="btn btn-purple" style="flex:1" onclick="createSharedRoom()">部屋を作る (ホスト)</button>
                <button class="btn btn-purple" style="flex:1" onclick="joinSharedRoom()">部屋に入る</button>
            </div>
        </div>

        <!-- 3. 直接1vs1対戦 -->
        <div class="menu-section">
            <h3>3. 直接 1vs1 バトル</h3>
            <input type="text" id="peer-id-input" placeholder="対戦相手のID">
            <button class="btn btn-orange btn-full" id="btn-direct-1vs1" onclick="connectDirect1vs1()">直接対戦を申し込む</button>
        </div>

        <div id="connection-status" style="font-size:13px; font-weight:bold; color:#f1c40f; margin-top:10px;">準備完了</div>
    </div>
</div>

<div id="ui-layer">
    <div id="flash-overlay"></div>
    <div id="damage-overlay"></div>
    <div id="crosshair"></div>
    <div id="status-top">MODE: <span id="mode-display">練習場</span></div>
    <div id="status-bottom">HP: <span id="hp">100</span></div>
    <div id="weapon-display">ライフル (1)</div>
    <div id="ammo-display">30 / 30</div>
    <div id="target-hit-msg">HIT!</div>

    <!-- 他プレイヤーの頭上表示用UIコンテナ領域 -->
    <div id="nametags-container-layer"></div>

    <div id="mobile-look-area"></div>
    <div id="joystick-container"><div id="joystick-stick"></div></div>
    
    <div class="mobile-btn" id="btn-shoot">撃つ</div>
    <div class="mobile-btn" id="btn-jump">跳</div>
    <div class="mobile-btn" id="btn-crouch">屈</div>
    <div class="mobile-btn" id="btn-scope">覗</div>
    <div class="mobile-btn" id="btn-reload">R</div>
    <div class="mobile-btn" id="btn-weapon">武器</div>
</div>

<script>
const INVERT_Y = false;

// ゲーム状態管理
let isMobile = false;
let isPlaying = false;
let gameMode = 'SOLO'; // 'SOLO', 'SHARED', '1VS1'
let myHP = 100;
let myName = "Player";
let myPeerId = "";

// P2P ネットワーク管理
let peer = null;
let roomConnections = []; // ホストの場合：接続されているクライアント一覧
let hostConnection = null; // クライアントの場合：ホストへの接続
let direct1vs1Conn = null; // 1vs1用

// 共有練習場内の全プレイヤー情報
let remotePlayers = {}; // id -> { mesh, name, peerId, hp }

// LocalStorage 名前の保持
const savedName = localStorage.getItem('fps_player_name') || "Player_" + Math.floor(Math.random()*1000);
const nameInputEl = document.getElementById('player-name-input');
nameInputEl.value = savedName;
myName = savedName;

nameInputEl.addEventListener('input', (e) => {
    myName = e.target.value.trim() || "Player";
    localStorage.setItem('fps_player_name', myName);
});

// PeerJS 初期化
myPeerId = localStorage.getItem('fps_peer_id') || ('user-' + Math.random().toString(36).substr(2, 6));
localStorage.setItem('fps_peer_id', myPeerId);

peer = new Peer(myPeerId);
peer.on('open', id => { 
    myPeerId = id;
    document.getElementById('my-id').innerText = id; 
});

peer.on('connection', conn => {
    setupIncomingConnection(conn);
});

function updateStatus(text, color="#f1c40f") {
    const el = document.getElementById('connection-status');
    el.innerText = text;
    el.style.color = color;
}

// 武器データ
const WEAPONS = [
    { name: "ライフル", maxAmmo: 30, reloadTime: 1500, bodyDamage: 15, headDamage: 50, pellets: 1, spread: 0, scopeFov: 30 },
    { name: "ショットガン", maxAmmo: 8, reloadTime: 2000, bodyDamage: 8, headDamage: 12, pellets: 8, spread: 0.08, scopeFov: 50 },
    { name: "スナイパー", maxAmmo: 5, reloadTime: 2500, bodyDamage: 70, headDamage: 100, pellets: 1, spread: 0, scopeFov: 15 }
];
let currentWeaponIdx = 0;
let ammoList = WEAPONS.map(w => w.maxAmmo);
let isReloading = false;

// -------------------------------------------------------------
// ネットワーク通信処理（共有練習場・1vs1）
// -------------------------------------------------------------
function setupIncomingConnection(conn) {
    conn.on('open', () => {
        conn.on('data', data => handleNetworkData(conn, data));
    });
    conn.on('close', () => removePlayer(conn.peer));
}

function handleNetworkData(conn, data) {
    if (!data || !data.type) return;

    // 1vs1 挑戦リクエスト受信
    if (data.type === 'challenge_request') {
        if (confirm(`${data.fromName} (ID: ${data.fromId}) から1vs1の対戦申し込みが来ました！戦いますか？`)) {
            conn.send({ type: 'challenge_accept', fromId: myPeerId, fromName: myName });
            start1vs1Battle(conn, false);
        } else {
            conn.send({ type: 'challenge_reject' });
        }
    }
    else if (data.type === 'challenge_accept') {
        alert("対戦が承認されました！1vs1バトルを開始します。");
        start1vs1Battle(conn, true);
    }
    else if (data.type === 'challenge_reject') {
        alert("対戦の申し込みが拒否されました。");
    }
    // 状態同期 (位置、ポーズなど)
    else if (data.type === 'player_state') {
        updateRemotePlayer(data);
        
        // ホストの場合、他の全クライアントに中継（マルチロビー用）
        if (gameMode === 'SHARED' && roomConnections.length > 0) {
            broadcastExcept(data, conn.peer);
        }
    }
    // 被弾判定
    else if (data.type === 'hit') {
        if (data.targetId === myPeerId) {
            myHP -= data.damage;
            document.getElementById('hp').innerText = Math.max(0, Math.floor(myHP));
            const overlay = document.getElementById('damage-overlay');
            overlay.style.opacity = 0.6;
            setTimeout(() => overlay.style.opacity = 0, 100);

            if (myHP <= 0) {
                alert("倒されました！");
                location.reload();
            }
        }
    }
}

function broadcastExcept(data, excludePeerId) {
    roomConnections.forEach(c => {
        if (c.peer !== excludePeerId && c.open) {
            c.send(data);
        }
    });
}

function broadcastAll(data) {
    if (hostConnection && hostConnection.open) {
        hostConnection.send(data);
    } else {
        roomConnections.forEach(c => { if (c.open) c.send(data); });
    }
    if (direct1vs1Conn && direct1vs1Conn.open) {
        direct1vs1Conn.send(data);
    }
}

// -------------------------------------------------------------
// モード切替・開始処理
// -------------------------------------------------------------
function startPracticeMode(mobileMode) {
    gameMode = 'SOLO';
    document.getElementById('mode-display').innerText = "ソロ練習場";
    createPracticeTargets();
    initGameUI(mobileMode);
}

function createSharedRoom() {
    gameMode = 'SHARED';
    document.getElementById('mode-display').innerText = `共有練習場 (HOST: ${myPeerId})`;
    createPracticeTargets();
    
    peer.on('connection', conn => {
        roomConnections.push(conn);
        setupIncomingConnection(conn);
    });

    const isMob = confirm("スマホで操作しますか？ OK:スマホ / キャンセル:PC");
    initGameUI(isMob);
}

function joinSharedRoom() {
    const roomId = document.getElementById('room-id-input').value.trim();
    if (!roomId) return alert("入る部屋のIDを入力してください！");
    if (roomId === myPeerId) return alert("自分のIDではなく、ホストのIDを入力してください。");

    updateStatus("部屋に接続中...", "#f1c40f");
    hostConnection = peer.connect(roomId, { reliable: true });

    hostConnection.on('open', () => {
        gameMode = 'SHARED';
        document.getElementById('mode-display').innerText = `共有練習場 (ROOM: ${roomId})`;
        createPracticeTargets();
        
        const isMob = confirm("スマホで操作しますか？ OK:スマホ / キャンセル:PC");
        initGameUI(isMob);
    });

    hostConnection.on('data', data => handleNetworkData(hostConnection, data));
    hostConnection.on('error', err => alert("接続エラー: " + err));
}

function connectDirect1vs1() {
    const targetId = document.getElementById('peer-id-input').value.trim();
    if (!targetId) return alert("対戦相手のIDを入力してください");
    
    updateStatus("相手へ対戦リクエスト送信中...", "#f1c40f");
    const conn = peer.connect(targetId, { reliable: true });
    
    conn.on('open', () => {
        conn.send({
            type: 'challenge_request',
            fromId: myPeerId,
            fromName: myName
        });
        conn.on('data', data => handleNetworkData(conn, data));
    });
}

function request1vs1ToPlayer(targetPeerId) {
    if (confirm(`ID: ${targetPeerId} に1vs1対戦を申し込みますか？`)) {
        const conn = peer.connect(targetPeerId, { reliable: true });
        conn.on('open', () => {
            conn.send({
                type: 'challenge_request',
                fromId: myPeerId,
                fromName: myName
            });
            conn.on('data', data => handleNetworkData(conn, data));
        });
    }
}

function start1vs1Battle(conn, isInitiator) {
    direct1vs1Conn = conn;
    gameMode = '1VS1';
    document.getElementById('mode-display').innerText = "1vs1 バトル";
    
    // 既存のリモートプレイヤーをクリア
    Object.keys(remotePlayers).forEach(id => removePlayer(id));

    if (isInitiator) {
        camera.position.set(0, player.height, 12);
        player.yaw = Math.PI;
    } else {
        camera.position.set(0, player.height, -12);
        player.yaw = 0;
    }

    const isMob = confirm("スマホで操作しますか？ OK:スマホ / キャンセル:PC");
    initGameUI(isMob);
}

function initGameUI(mobileMode) {
    isMobile = mobileMode;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'block';
    
    isPlaying = true;
    updateWeaponDisplay();

    if (!isMobile) {
        const lock = () => { if (isPlaying && document.pointerLockElement !== document.body) document.body.requestPointerLock(); };
        lock();
        document.addEventListener('click', lock);

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                player.yaw -= e.movementX * 0.002;
                const pitchDelta = e.movementY * 0.002;
                player.pitch += INVERT_Y ? pitchDelta : -pitchDelta;
                player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));
                camera.rotation.set(player.pitch, player.yaw, 0);
            }
        });
        document.addEventListener('keydown', (e) => {
            if(e.code==='KeyW') keys.w = true;
            if(e.code==='KeyS') keys.s = true;
            if(e.code==='KeyA') keys.a = true;
            if(e.code==='KeyD') keys.d = true;
            if(e.code==='Space') jump();
            if(e.code==='ShiftLeft') crouch(true);
            if(e.code==='KeyR' || e.key==='r' || e.key==='R') reload(); 
            if(e.code==='Digit1') switchWeapon(0);
            if(e.code==='Digit2') switchWeapon(1);
            if(e.code==='Digit3') switchWeapon(2);
        });
        document.addEventListener('keyup', (e) => {
            if(e.code==='KeyW') keys.w = false;
            if(e.code==='KeyS') keys.s = false;
            if(e.code==='KeyA') keys.a = false;
            if(e.code==='KeyD') keys.d = false;
            if(e.code==='ShiftLeft') crouch(false);
        });
        document.addEventListener('mousedown', (e) => {
            if(document.pointerLockElement === document.body) {
                if(e.button === 0) shoot();
                if(e.button === 2) toggleScope();
            }
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
    } else {
        document.querySelectorAll('.mobile-btn').forEach(b => b.style.display = 'flex');
        document.getElementById('joystick-container').style.display = 'block';
        document.getElementById('mobile-look-area').style.display = 'block';
        setupPointerControls();
    }
}

// -------------------------------------------------------------
// プレイヤーオブジェクト・頭上ネームタグ管理
// -------------------------------------------------------------
function updateRemotePlayer(data) {
    if (data.id === myPeerId) return;

    let p = remotePlayers[data.id];
    if (!p) {
        // 新規プレイヤーの3Dメッシュ＆UI作成
        const group = new THREE.Group();
        const bMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 1), new THREE.MeshLambertMaterial({ color: 0xe74c3c }));
        bMesh.position.y = 0.75;
        group.add(bMesh);

        const hMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0xf1c40f }));
        hMesh.position.y = 1.9;
        group.add(hMesh);

        scene.add(group);

        // 頭上UI（名前・ID・戦うボタン）
        const uiContainer = document.createElement('div');
        uiContainer.className = 'nametag-container';
        uiContainer.innerHTML = `
            <div class="nametag-box">
                <div>${data.name}</div>
                <div class="nametag-id">ID: ${data.id}</div>
                <button class="btn-challenge" onclick="request1vs1ToPlayer('${data.id}')">⚔️ 1vs1で戦う</button>
            </div>
        `;
        document.getElementById('nametags-container-layer').appendChild(uiContainer);

        p = {
            mesh: group,
            body: bMesh,
            head: hMesh,
            ui: uiContainer,
            name: data.name,
            peerId: data.id,
            hp: data.hp || 100
        };
        remotePlayers[data.id] = p;
    }

    p.mesh.position.set(data.x, data.y, data.z);
    p.mesh.rotation.y = data.yaw;
    if (data.crouch) {
        p.body.scale.y = 0.5;
        p.head.position.y = 1.0;
    } else {
        p.body.scale.y = 1;
        p.head.position.y = 1.9;
    }
    p.mesh.updateMatrixWorld(true);
}

function removePlayer(id) {
    if (remotePlayers[id]) {
        scene.remove(remotePlayers[id].mesh);
        if (remotePlayers[id].ui) remotePlayers[id].ui.remove();
        delete remotePlayers[id];
    }
}

function updateNametagsPosition() {
    Object.values(remotePlayers).forEach(p => {
        const pos = p.mesh.position.clone();
        pos.y += 2.6;
        pos.project(camera);

        const x = (pos.x * .5 + .5) * window.innerWidth;
        const y = (pos.y * -.5 + .5) * window.innerHeight;

        if (pos.z < 1 && x > 0 && x < window.innerWidth && y > 0 && y < window.innerHeight) {
            p.ui.style.display = 'block';
            p.ui.style.left = `${x}px`;
            p.ui.style.top = `${y}px`;
        } else {
            p.ui.style.display = 'none';
        }
    });
}

// -------------------------------------------------------------
// Three.js シーン構築
// -------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); 

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.domElement.style.position = 'absolute';
renderer.domElement.style.top = '0';
renderer.domElement.style.left = '0';
renderer.domElement.style.zIndex = '1';
renderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x555555));

// 床
const floorGeom = new THREE.PlaneGeometry(120, 120);
const floorMat = new THREE.MeshLambertMaterial({ color: 0x2E8B57 });
const floor = new THREE.Mesh(floorGeom, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const gridHelper = new THREE.GridHelper(120, 60, 0x000000, 0x000000);
gridHelper.material.opacity = 0.2;
gridHelper.material.transparent = true;
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// 練習用ターゲット群
const practiceTargets = [];
function createPracticeTargets() {
    if (practiceTargets.length > 0) return;
    const targetPositions = [
        { x: -8, y: 2, z: 0 },
        { x: 0, y: 2.5, z: 10 },
        { x: 8, y: 1.8, z: -4 },
        { x: -12, y: 3, z: 15 },
        { x: 12, y: 2, z: 12 }
    ];

    targetPositions.forEach(pos => {
        const group = new THREE.Group();
        
        const outerGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.1, 32);
        const outerMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const outer = new THREE.Mesh(outerGeo, outerMat);
        outer.rotation.x = Math.PI / 2;
        group.add(outer);

        const innerGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.12, 32);
        const innerMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
        const inner = new THREE.Mesh(innerGeo, innerMat);
        inner.rotation.x = Math.PI / 2;
        group.add(inner);

        const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, pos.y, 16);
        const poleMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.y = -pos.y / 2;
        group.add(pole);

        group.position.set(pos.x, pos.y, pos.z);
        scene.add(group);
        
        outer.userData = { isTarget: true, inner: false, parentGroup: group };
        inner.userData = { isTarget: true, inner: true, parentGroup: group };
        practiceTargets.push(outer, inner);
    });
}

// 弾痕管理
const bulletHoles = [];
const MAX_BULLET_HOLES = 50;

function createBulletHole(point, normal) {
    const holeGeo = new THREE.CircleGeometry(0.08, 12);
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide });
    const hole = new THREE.Mesh(holeGeo, holeMat);

    hole.position.copy(point).add(normal.clone().multiplyScalar(0.01));
    hole.lookAt(point.clone().add(normal));

    scene.add(hole);
    bulletHoles.push(hole);

    if (bulletHoles.length > MAX_BULLET_HOLES) {
        const oldHole = bulletHoles.shift();
        scene.remove(oldHole);
        oldHole.geometry.dispose();
        oldHole.material.dispose();
    }
}

// プレイヤー移動パラメーター
const player = {
    velocity: new THREE.Vector3(),
    speed: 15,
    jumpForce: 12,
    forwardBoost: 0,
    gravity: 30,
    isGrounded: false,
    isCrouching: false,
    isScoping: false,
    height: 1.6,
    crouchHeight: 0.8,
    pitch: 0,
    yaw: 0
};
const keys = { w: false, a: false, s: false, d: false };
let moveInput = { x: 0, z: 0 };

function jump() {
    if (player.isGrounded && !player.isCrouching) {
        player.velocity.y = player.jumpForce;
        player.isGrounded = false;
        player.forwardBoost = 12;
    }
}

function crouch(isDown) {
    player.isCrouching = isDown;
    camera.position.y = isDown ? player.crouchHeight : player.height;
}

function toggleScope() {
    player.isScoping = !player.isScoping;
    camera.fov = player.isScoping ? WEAPONS[currentWeaponIdx].scopeFov : 75;
    camera.updateProjectionMatrix();
}

function switchWeapon(index) {
    if (isReloading || index === currentWeaponIdx) return;
    currentWeaponIdx = index;
    if (player.isScoping) {
        camera.fov = WEAPONS[currentWeaponIdx].scopeFov;
        camera.updateProjectionMatrix();
    }
    updateWeaponDisplay();
}

function cycleWeapon() { switchWeapon((currentWeaponIdx + 1) % WEAPONS.length); }

function reload() {
    const w = WEAPONS[currentWeaponIdx];
    if (isReloading || ammoList[currentWeaponIdx] === w.maxAmmo) return;
    isReloading = true;
    updateWeaponDisplay();
    setTimeout(() => {
        ammoList[currentWeaponIdx] = w.maxAmmo;
        isReloading = false;
        updateWeaponDisplay();
    }, w.reloadTime); 
}

function updateWeaponDisplay() {
    const w = WEAPONS[currentWeaponIdx];
    document.getElementById('weapon-display').innerText = `${w.name} (${currentWeaponIdx + 1})`;
    const ammoEl = document.getElementById('ammo-display');
    if (isReloading) {
        ammoEl.innerText = "Reloading...";
        ammoEl.classList.add('reloading');
    } else {
        ammoEl.innerText = `${ammoList[currentWeaponIdx]} / ${w.maxAmmo}`;
        ammoEl.classList.remove('reloading');
    }
}

// 射撃・レイキャスト判定
const raycaster = new THREE.Raycaster();

function shoot() {
    if (!isPlaying || isReloading) return;
    const w = WEAPONS[currentWeaponIdx];

    if (ammoList[currentWeaponIdx] <= 0) return reload();

    ammoList[currentWeaponIdx]--;
    updateWeaponDisplay();

    const flash = document.getElementById('flash-overlay');
    flash.style.opacity = 0.3;
    const crosshair = document.getElementById('crosshair');
    crosshair.classList.add('shooting');
    
    setTimeout(() => {
        flash.style.opacity = 0;
        crosshair.classList.remove('shooting');
    }, 50);

    player.pitch -= (currentWeaponIdx === 1 ? 0.03 : 0.015);
    camera.rotation.set(player.pitch, player.yaw, 0);

    // 衝突判定対象リストを作成
    const remoteMeshes = [];
    Object.values(remotePlayers).forEach(p => {
        remoteMeshes.push(p.body, p.head);
    });

    const targetsToRay = [floor, ...practiceTargets, ...remoteMeshes];

    for (let i = 0; i < w.pellets; i++) {
        let screenPos = new THREE.Vector2(0, 0);
        if (w.spread > 0) {
            screenPos.x += (Math.random() - 0.5) * w.spread;
            screenPos.y += (Math.random() - 0.5) * w.spread;
        }

        raycaster.setFromCamera(screenPos, camera);
        const intersects = raycaster.intersectObjects(targetsToRay, false);
        
        if (intersects.length > 0) {
            const hit = intersects[0];
            const hitObj = hit.object;

            if (hit.point && hit.face) {
                createBulletHole(hit.point, hit.face.normal);
            }

            // ターゲット（的）ヒット
            if (hitObj.userData && hitObj.userData.isTarget) {
                crosshair.classList.add('hit-marker');
                setTimeout(() => crosshair.classList.remove('hit-marker'), 120);

                const dmg = hitObj.userData.inner ? w.headDamage : w.bodyDamage;
                showTargetHitMessage(hitObj.userData.inner ? `BULLSEYE! -${dmg}` : `HIT! -${dmg}`);

                const grp = hitObj.userData.parentGroup;
                grp.position.z += 0.1;
                setTimeout(() => grp.position.z -= 0.1, 50);
            }

            // 他プレイヤーヒット判定
            Object.values(remotePlayers).forEach(p => {
                if (hitObj === p.body || hitObj === p.head) {
                    crosshair.classList.add('hit-marker');
                    setTimeout(() => crosshair.classList.remove('hit-marker'), 120);
                    const damage = (hitObj === p.head) ? w.headDamage : w.bodyDamage;
                    
                    broadcastAll({
                        type: 'hit',
                        targetId: p.peerId,
                        damage: damage
                    });
                }
            });
        }
    }
}

function showTargetHitMessage(msg) {
    const el = document.getElementById('target-hit-msg');
    el.innerText = msg;
    el.style.opacity = 1;
    setTimeout(() => el.style.opacity = 0, 400);
}

// スマホタッチ操作
function setupPointerControls() {
    const bindBtn = (id, action) => {
        const el = document.getElementById(id);
        el.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); action(); });
    };
    bindBtn('btn-shoot', shoot);
    bindBtn('btn-jump', jump);
    bindBtn('btn-crouch', () => crouch(!player.isCrouching));
    bindBtn('btn-scope', toggleScope);
    bindBtn('btn-reload', reload);
    bindBtn('btn-weapon', cycleWeapon);

    const lookArea = document.getElementById('mobile-look-area');
    let lookPointerId = null, lastLookX = 0, lastLookY = 0;

    lookArea.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (lookPointerId === null) {
            lookPointerId = e.pointerId;
            lastLookX = e.clientX; lastLookY = e.clientY;
            try { lookArea.setPointerCapture(e.pointerId); } catch(err){}
        }
    });

    lookArea.addEventListener('pointermove', (e) => {
        if (e.pointerId === lookPointerId) {
            const dx = e.clientX - lastLookX, dy = e.clientY - lastLookY;
            player.yaw -= dx * 0.004;
            const pitchDelta = dy * 0.004;
            player.pitch += INVERT_Y ? pitchDelta : -pitchDelta;
            player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));
            camera.rotation.set(player.pitch, player.yaw, 0);
            lastLookX = e.clientX; lastLookY = e.clientY;
        }
    });

    const endLook = (e) => {
        if (e.pointerId === lookPointerId) {
            lookPointerId = null;
            try { lookArea.releasePointerCapture(e.pointerId); } catch(err){}
        }
    };
    lookArea.addEventListener('pointerup', endLook);
    lookArea.addEventListener('pointercancel', endLook);

    const joyContainer = document.getElementById('joystick-container');
    const joyStick = document.getElementById('joystick-stick');
    let joyPointerId = null, joyCenterX = 0, joyCenterY = 0;

    joyContainer.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (joyPointerId === null) {
            joyPointerId = e.pointerId;
            const rect = joyContainer.getBoundingClientRect();
            joyCenterX = rect.left + rect.width / 2;
            joyCenterY = rect.top + rect.height / 2;
            try { joyContainer.setPointerCapture(e.pointerId); } catch(err){}
            updateJoy(e);
        }
    });

    joyContainer.addEventListener('pointermove', (e) => { if (e.pointerId === joyPointerId) updateJoy(e); });

    function updateJoy(e) {
        let dx = e.clientX - joyCenterX, dy = e.clientY - joyCenterY;
        let dist = Math.hypot(dx, dy), maxDist = 40;
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
        moveInput.x = -dx / maxDist; moveInput.z = -dy / maxDist;
    }

    const endJoy = (e) => {
        if (e.pointerId === joyPointerId) {
            joyPointerId = null;
            joyStick.style.transform = 'translate(0px, 0px)';
            moveInput.x = 0; moveInput.z = 0;
            try { joyContainer.releasePointerCapture(e.pointerId); } catch(err){}
        }
    };
    joyContainer.addEventListener('pointerup', endJoy);
    joyContainer.addEventListener('pointercancel', endJoy);
}

// -------------------------------------------------------------
// メインゲームループ
// -------------------------------------------------------------
let prevTime = performance.now();

function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time - prevTime) / 1000;
    prevTime = time;

    if (isPlaying) {
        // 移動・物理演算
        player.velocity.y -= player.gravity * delta;

        let dirX = 0, dirZ = 0;
        if (isMobile) {
            dirX = moveInput.x; dirZ = moveInput.z;
        } else {
            dirZ = Number(keys.w) - Number(keys.s);
            dirX = Number(keys.a) - Number(keys.d);
            let len = Math.hypot(dirX, dirZ);
            if (len > 1) { dirX /= len; dirZ /= len; }
        }

        const moveSpeed = player.isCrouching ? player.speed * 0.4 : player.speed;

        if (dirX !== 0 || dirZ !== 0) {
            const angle = player.yaw;
            camera.position.x -= (Math.sin(angle) * dirZ + Math.cos(angle) * dirX) * moveSpeed * delta;
            camera.position.z -= (Math.cos(angle) * dirZ - Math.sin(angle) * dirX) * moveSpeed * delta;
        }

        if (player.forwardBoost > 0) {
            camera.position.x += -Math.sin(player.yaw) * player.forwardBoost * delta;
            camera.position.z += -Math.cos(player.yaw) * player.forwardBoost * delta;
            player.forwardBoost = Math.max(0, player.forwardBoost - 40 * delta);
        }

        camera.position.y += player.velocity.y * delta;
        
        const currentGround = player.isCrouching ? player.crouchHeight : player.height;
        if (camera.position.y <= currentGround) {
            player.velocity.y = 0;
            camera.position.y = currentGround;
            player.isGrounded = true;
        }

        // 位置情報の送信（ソロモード以外）
        if (gameMode !== 'SOLO') {
            const modelY = camera.position.y - currentGround;
            broadcastAll({
                type: 'player_state',
                id: myPeerId,
                name: myName,
                x: camera.position.x,
                y: modelY, 
                z: camera.position.z,
                yaw: player.yaw,
                crouch: player.isCrouching,
                hp: Math.floor(myHP)
            });
        }

        updateNametagsPosition();
    }

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
