<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1vs1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        
        /* ロビーメニュー */
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; overflow-y: auto; padding: 20px; }
        .menu-box { background: #222; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #555; max-width: 400px; width: 100%; }
        .menu-section { margin-bottom: 12px; padding: 10px; background: #333; border-radius: 8px; }
        input[type="text"] { padding: 10px; margin: 5px 0; border-radius: 4px; border: none; width: 80%; text-align: center; font-size: 16px; touch-action: auto; }
        button { padding: 12px 20px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; background: #3498db; color: white; font-weight: bold; font-size: 16px; }
        button.btn-practice { background: #2ecc71; width: 90%; margin-top: 8px; }
        .status-text { font-weight: bold; margin-top: 8px; font-size: 14px; }
        .text-success { color: #2ecc71; }
        .text-error { color: #e74c3c; }
        .text-wait { color: #f1c40f; }

        /* ゲーム操作UIレイヤー */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 100; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: red; border-radius: 50%; transform: translate(-50%, -50%); transition: transform 0.05s, background 0.1s; pointer-events: none; }
        .shooting { transform: translate(-50%, -50%) scale(2) !important; background: yellow !important;} 
        .hit-marker { transform: translate(-50%, -50%) scale(2.5) !important; background: #2ecc71 !important; }

        #status-top { position: absolute; top: 15px; left: 15px; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 0 #000; pointer-events: none; }
        #status-bottom { position: absolute; bottom: 15px; left: 15px; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; }
        #weapon-display { position: absolute; bottom: 50px; right: 15px; font-size: 20px; font-weight: bold; color: #f39c12; text-shadow: 2px 2px 0 #000; pointer-events: none; }
        #ammo-display { position: absolute; bottom: 15px; right: 15px; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; }
        .reloading { color: #f1c40f; }

        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: red; opacity: 0; transition: opacity 0.1s; pointer-events: none;}
        #flash-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: white; opacity: 0; transition: opacity 0.05s; pointer-events: none;}
        #enemy-name-label { position: absolute; display: none; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 13px; font-weight: bold; pointer-events: none; transform: translate(-50%, -100%); white-space: nowrap; border: 1px solid rgba(255,255,255,0.3); }

        #target-hit-msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; font-weight: bold; color: #f39c12; text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity 0.2s; pointer-events: none; }

        /* スマホ用タッチエリア設定 */
        #mobile-look-area { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; z-index: 105; display: none; }
        
        #joystick-container { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: none; pointer-events: auto; z-index: 110; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; }

        .mobile-btn { position: absolute; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.9); border-radius: 50%; width: 65px; height: 65px; display: none; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; font-size: 16px; color: white; z-index: 120; }
        .mobile-btn:active { background: rgba(255,255,255,0.7); }
        #btn-shoot { bottom: 30px; right: 30px; width: 90px; height: 90px; background: rgba(231, 76, 60, 0.7); border-color: #e74c3c; font-size: 22px; }
        #btn-jump { bottom: 140px; right: 30px; }
        #btn-crouch { bottom: 30px; right: 140px; }
        #btn-scope { bottom: 140px; right: 140px; }
        #btn-reload { bottom: 230px; right: 30px; width: 50px; height: 50px; font-size: 14px; }
        #btn-weapon { top: 15px; right: 15px; width: 80px; height: 45px; border-radius: 8px; background: rgba(243, 156, 18, 0.7); border-color: #f39c12; font-size: 14px; }
    </style>
</head>
<body>

<div id="menu">
    <div class="menu-box">
        <h2 style="margin-top:0;">3D FPS ロビー</h2>
        <div class="menu-section">
            <p style="margin:4px 0;">プレイヤー名</p>
            <input type="text" id="player-name-input" placeholder="名前を入力" value="Player">
        </div>
        
        <div class="menu-section" style="border: 1px solid #2ecc71;">
            <p style="margin:4px 0; font-weight:bold; color:#2ecc71;">ソロ練習場 (的当て)</p>
            <button class="btn-practice" onclick="startPracticeMode(false)">練習場へ入る (PC)</button>
            <button class="btn-practice" onclick="startPracticeMode(true)">練習場へ入る (スマホ)</button>
        </div>

        <div class="menu-section">
            <p style="margin:4px 0;">あなたのID</p>
            <h3 id="my-id" style="color: #f1c40f; margin:4px 0;">生成中...</h3>
            <button onclick="copyMyId()">IDをコピー</button>
        </div>
        <div class="menu-section">
            <p style="margin:4px 0;">対戦相手のIDを入力</p>
            <input type="text" id="peer-id-input" placeholder="例: user-xxxxxx">
            <button id="btn-connect" onclick="connectToPeer()">接続する</button>
            <div id="connection-status" class="status-text text-wait">接続待機中...</div>
        </div>
        <div class="menu-section" id="start-section" style="opacity: 0.5; pointer-events: none;">
            <p style="margin:4px 0;">接続完了！1vs1対戦を開始</p>
            <button id="btn-pc" onclick="startGame(false)">PC (キーボード&マウス)</button>
            <button id="btn-mobile" onclick="startGame(true)">スマホ (タッチ操作)</button>
        </div>
    </div>
</div>

<div id="ui-layer">
    <div id="flash-overlay"></div>
    <div id="damage-overlay"></div>
    <div id="crosshair"></div>
    <div id="status-top">Target: <span id="target-name">???</span></div>
    <div id="status-bottom">HP: <span id="hp">100</span></div>
    <div id="weapon-display">ライフル (1)</div>
    <div id="ammo-display">30 / 30</div>
    <div id="enemy-name-label">Enemy HP: 100</div>
    <div id="target-hit-msg">HIT!</div>

    <div id="mobile-look-area"></div>
    <div id="joystick-container"><div id="joystick-stick"></div></div>
    
    <div class="mobile-btn" id="btn-shoot">撃つ</div>
    <div class="mobile-btn" id="btn-jump">跳</div>
    <div class="mobile-btn" id="btn-crouch">屈</div>
    <div class="mobile-btn" id="btn-scope">覗</div>
    <div class="mobile-btn" id="btn-reload">R</div>
    <div class="mobile-btn" id="btn-weapon">武器切替</div>
</div>

<script>
const INVERT_Y = false;

let isMobile = false;
let isPlaying = false;
let isPracticeMode = false;
let myHP = 100;
let enemyHP = 100;
let myName = "Player";
let enemyName = "Enemy";
let isHost = false;

const savedName = localStorage.getItem('game_3d_name') || "Player";
const nameInputEl = document.getElementById('player-name-input');
nameInputEl.value = savedName;
myName = savedName;

nameInputEl.addEventListener('input', (e) => {
    const val = e.target.value.trim() || "Player";
    localStorage.setItem('game_3d_name', val);
});

let lastDamageTime = performance.now();

const WEAPONS = [
    { name: "ライフル", maxAmmo: 30, reloadTime: 1500, bodyDamage: 15, headDamage: 30, pellets: 1, spread: 0.05, scopeFov: 30, isAuto: true, fireRate: 100 },
    { name: "ショットガン", maxAmmo: 8, reloadTime: 2000, bodyDamage: 7, headDamage: 14, pellets: 8, spread: 0.15, scopeFov: 50, isAuto: false, fireRate: 800 },
    { name: "スナイパー", maxAmmo: 5, reloadTime: 2500, bodyDamage: 70, headDamage: 100, pellets: 1, spread: 0.1, scopeFov: 15, isAuto: false, fireRate: 1200 },
    { name: "サブマシンガン", maxAmmo: 40, reloadTime: 1200, bodyDamage: 8, headDamage: 12, pellets: 1, spread: 0.08, scopeFov: 50, isAuto: true, fireRate: 70 },
    { name: "セミオート", maxAmmo: 15, reloadTime: 1400, bodyDamage: 32, headDamage: 64, pellets: 1, spread: 0.02, scopeFov: 35, isAuto: false, fireRate: 180 },
    { name: "FAMAS (3点バースト)", maxAmmo: 25, reloadTime: 1300, bodyDamage: 18, headDamage: 36, pellets: 1, spread: 0.05, scopeFov: 40, isAuto: false, isBurst: true, burstCount: 3, burstDelay: 70, fireRate: 450 },
    { name: "ナイフ", maxAmmo: "∞", reloadTime: 0, bodyDamage: 50, headDamage: 100, pellets: 1, spread: 0, scopeFov: 75, range: 4, isAuto: false, fireRate: 400 }
];
let currentWeaponIdx = 0;
let ammoList = WEAPONS.map(w => w.maxAmmo);
let isReloading = false;
let isAutoShooting = false;
let isBursting = false;
let lastShootTime = 0;

let peer = null, conn = null;
let fixedPeerId = localStorage.getItem('game_3d_id') || ('user-' + Math.random().toString(36).substr(2, 6));
localStorage.setItem('game_3d_id', fixedPeerId);

peer = new Peer(fixedPeerId);

peer.on('open', id => { document.getElementById('my-id').innerText = id; });
peer.on('error', err => { updateStatus("通信エラー: " + err.type, "error"); });
peer.on('connection', connection => {
    if(conn && conn.open) { connection.close(); return; }
    conn = connection;
    isHost = true;
    setupConnection();
});

function connectToPeer() {
    const targetId = document.getElementById('peer-id-input').value.trim();
    if(!targetId) return alert("相手のIDを入力してください！");
    if(targetId === fixedPeerId) return alert("自分のIDです！");
    
    updateStatus("相手に接続要求を送信中...", "wait");
    document.getElementById('btn-connect').disabled = true;

    conn = peer.connect(targetId, { reliable: true });
    isHost = false;
    setupConnection();
}

function updateStatus(text, type) {
    const statusEl = document.getElementById('connection-status');
    statusEl.innerText = text;
    statusEl.className = "status-text text-" + type;
}

function setupConnection() {
    conn.on('open', () => {
        updateStatus("通信確立！ハンドシェイク中...", "wait");
        myName = nameInputEl.value.trim() || "Player";
        localStorage.setItem('game_3d_name', myName);
        sendData({ type: 'init', name: myName, id: fixedPeerId });
    });

    conn.on('data', data => {
        if (!data || !data.type) return;

        if (data.type === 'init') {
            enemyName = data.name;
            document.getElementById('target-name').innerText = enemyName;
            sendData({ type: 'init_ack', name: myName });
            enableStartGame();
        }
        else if (data.type === 'init_ack') {
            enemyName = data.name;
            document.getElementById('target-name').innerText = enemyName;
            enableStartGame();
        }
        else if (data.type === 'state' && isPlaying && !isPracticeMode) {
            enemyGroup.position.set(data.x, data.y, data.z);
            enemyGroup.rotation.y = data.yaw;
            
            if (data.weapon !== undefined) {
                updateEnemyWeapon(data.weapon);
            }

            if (data.hp !== undefined) {
                enemyHP = data.hp;
                if (enemyHP <= 0) {
                    isPlaying = false;
                    setTimeout(() => {
                        alert(`YOU WIN! ${enemyName} を倒しました！`);
                        location.reload();
                    }, 100);
                }
            }
            
            if(data.crouch) {
                enemyBody.scale.y = 0.5;
                enemyHead.position.y = 1.0;
            } else {
                enemyBody.scale.y = 1;
                enemyHead.position.y = 1.9;
            }
            enemyGroup.updateMatrixWorld(true);
        } 
        else if (data.type === 'hit' && isPlaying && !isPracticeMode) {
            myHP -= data.damage;
            lastDamageTime = performance.now(); 
            document.getElementById('hp').innerText = Math.max(0, Math.floor(myHP));
            
            const overlay = document.getElementById('damage-overlay');
            overlay.style.opacity = 0.6;
            setTimeout(() => overlay.style.opacity = 0, 100);

            if (myHP <= 0) {
                isPlaying = false;
                setTimeout(() => {
                    alert(`YOU LOSE... ${enemyName} に倒されました`);
                    location.reload();
                }, 100);
            }
        }
    });

    conn.on('close', () => { 
        if (isPlaying && !isPracticeMode) {
            alert("対戦相手との接続が切断されました。"); 
            location.reload(); 
        }
    });
    conn.on('error', () => { updateStatus("接続エラーが発生しました", "error"); document.getElementById('btn-connect').disabled = false; });
}

function enableStartGame() {
    updateStatus("★ 対戦準備が完了しました！ ★", "success");
    const startSec = document.getElementById('start-section');
    startSec.style.opacity = "1";
    startSec.style.pointerEvents = "auto";
}

function sendData(data) {
    if (conn && conn.open) {
        try { conn.send(data); } catch(e) {}
    }
}

function copyMyId() {
    navigator.clipboard.writeText(fixedPeerId).then(() => alert("IDをコピーしました！"));
}

let moveInput = { x: 0, z: 0 };

function startPracticeMode(mobileMode) {
    isPracticeMode = true;
    document.getElementById('target-name').innerText = "練習用ターゲット";
    createPracticeTargets();
    startGame(mobileMode);
}

function startGame(mobileMode) {
    myName = nameInputEl.value.trim() || "Player";
    localStorage.setItem('game_3d_name', myName);
    
    isMobile = mobileMode;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'block';
    
    if (isHost && !isPracticeMode) {
        camera.position.set(0, player.height, 10);
        player.yaw = Math.PI;
    } else {
        camera.position.set(0, player.height, -10);
        player.yaw = 0;
    }
    camera.rotation.set(player.pitch, player.yaw, 0);

    isPlaying = true;
    updateWeaponDisplay();

    if (!isMobile) {
        const requestLock = () => {
            if (isPlaying && !isMobile && document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        };

        requestLock();
        document.addEventListener('click', requestLock);

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                player.yaw -= e.movementX * 0.002;
                
                const pitchDelta = e.movementY * 0.002;
                player.pitch += INVERT_Y ? pitchDelta : -pitchDelta;
                player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));
                
                camera.rotation.set(player.pitch, player.yaw, 0);
            }
        });
        document.addEventListener('keydown', (e) => {
            if(e.code==='KeyW') keys.w = true;
            if(e.code==='KeyS') keys.s = true;
            if(e.code==='KeyA') keys.a = true;
            if(e.code==='KeyD') keys.d = true;
            if(e.code==='Space') jump();
            if(e.code==='ShiftLeft') crouch(true);
            if(e.code==='KeyR' || e.key==='r' || e.key==='R') reload(); 
            if(e.code==='Digit1') switchWeapon(0);
            if(e.code==='Digit2') switchWeapon(1);
            if(e.code==='Digit3') switchWeapon(2);
            if(e.code==='Digit4') switchWeapon(3);
            if(e.code==='Digit5') switchWeapon(4);
            if(e.code==='Digit6') switchWeapon(5);
            if(e.code==='Digit7') switchWeapon(6);
        });
        document.addEventListener('keyup', (e) => {
            if(e.code==='KeyW') keys.w = false;
            if(e.code==='KeyS') keys.s = false;
            if(e.code==='KeyA') keys.a = false;
            if(e.code==='KeyD') keys.d = false;
            if(e.code==='ShiftLeft') crouch(false);
        });
        
        document.addEventListener('mousedown', (e) => {
            if(document.pointerLockElement === document.body) {
                if(e.button === 0) handleShootStart();
                if(e.button === 2) toggleScope();
            }
        });
        document.addEventListener('mouseup', (e) => {
            if(e.button === 0) handleShootEnd();
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
    } else {
        document.querySelectorAll('.mobile-btn').forEach(b => b.style.display = 'flex');
        document.getElementById('joystick-container').style.display = 'block';
        document.getElementById('mobile-look-area').style.display = 'block';

        setupPointerControls();
    }
}

function setupPointerControls() {
    const bindBtn = (id, action) => {
        const el = document.getElementById(id);
        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            action();
        });
    };

    const btnShoot = document.getElementById('btn-shoot');
    btnShoot.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        handleShootStart();
    });
    btnShoot.addEventListener('pointerup', handleShootEnd);
    btnShoot.addEventListener('pointercancel', handleShootEnd);
    btnShoot.addEventListener('pointerleave', handleShootEnd);

    bindBtn('btn-jump', jump);
    bindBtn('btn-crouch', () => crouch(!player.isCrouching));
    bindBtn('btn-scope', toggleScope);
    bindBtn('btn-reload', reload);
    bindBtn('btn-weapon', cycleWeapon);

    const lookArea = document.getElementById('mobile-look-area');
    let lookPointerId = null;
    let lastLookX = 0, lastLookY = 0;

    lookArea.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (lookPointerId === null) {
            lookPointerId = e.pointerId;
            lastLookX = e.clientX;
            lastLookY = e.clientY;
            try { lookArea.setPointerCapture(e.pointerId); } catch(err){}
        }
    });

    lookArea.addEventListener('pointermove', (e) => {
        if (e.pointerId === lookPointerId) {
            const dx = e.clientX - lastLookX;
            const dy = e.clientY - lastLookY;
            
            player.yaw -= dx * 0.004;
            
            const pitchDelta = dy * 0.004;
            player.pitch += INVERT_Y ? pitchDelta : -pitchDelta;
            player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));
            
            camera.rotation.set(player.pitch, player.yaw, 0);
            
            lastLookX = e.clientX;
            lastLookY = e.clientY;
        }
    });

    const endLook = (e) => {
        if (e.pointerId === lookPointerId) {
            lookPointerId = null;
            try { lookArea.releasePointerCapture(e.pointerId); } catch(err){}
        }
    };
    lookArea.addEventListener('pointerup', endLook);
    lookArea.addEventListener('pointercancel', endLook);

    const joyContainer = document.getElementById('joystick-container');
    const joyStick = document.getElementById('joystick-stick');
    let joyPointerId = null;
    let joyCenterX = 0, joyCenterY = 0;

    joyContainer.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (joyPointerId === null) {
            joyPointerId = e.pointerId;
            const rect = joyContainer.getBoundingClientRect();
            joyCenterX = rect.left + rect.width / 2;
            joyCenterY = rect.top + rect.height / 2;
            try { joyContainer.setPointerCapture(e.pointerId); } catch(err){}
            updateJoy(e);
        }
    });

    joyContainer.addEventListener('pointermove', (e) => {
        if (e.pointerId === joyPointerId) {
            updateJoy(e);
        }
    });

    function updateJoy(e) {
        let dx = e.clientX - joyCenterX;
        let dy = e.clientY - joyCenterY;
        let dist = Math.hypot(dx, dy);
        let maxDist = 40;
        if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }
        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
        
        moveInput.x = -dx / maxDist; 
        moveInput.z = -dy / maxDist;
    }

    const endJoy = (e) => {
        if (e.pointerId === joyPointerId) {
            joyPointerId = null;
            joyStick.style.transform = 'translate(0px, 0px)';
            moveInput.x = 0;
            moveInput.z = 0;
            try { joyContainer.releasePointerCapture(e.pointerId); } catch(err){}
        }
    };
    joyContainer.addEventListener('pointerup', endJoy);
    joyContainer.addEventListener('pointercancel', endJoy);
}

// Three.js 描画設定
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); 

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.domElement.style.position = 'absolute';
renderer.domElement.style.top = '0';
renderer.domElement.style.left = '0';
renderer.domElement.style.zIndex = '1';
renderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

const floorGeom = new THREE.PlaneGeometry(100, 100);
const floorMat = new THREE.MeshLambertMaterial({ color: 0x2E8B57 });
const floor = new THREE.Mesh(floorGeom, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const gridHelper = new THREE.GridHelper(100, 50, 0x000000, 0x000000);
gridHelper.material.opacity = 0.2;
gridHelper.material.transparent = true;
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// 敵プレイヤーモデル構築
const enemyGroup = new THREE.Group();
scene.add(enemyGroup);

const bodyGeom = new THREE.BoxGeometry(1, 1.5, 1);
const bodyMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
const enemyBody = new THREE.Mesh(bodyGeom, bodyMat);
enemyBody.position.y = 0.75;
enemyGroup.add(enemyBody);

const headGeom = new THREE.BoxGeometry(0.8, 0.8, 0.8);
const headMat = new THREE.MeshLambertMaterial({ color: 0xf1c40f });
const enemyHead = new THREE.Mesh(headGeom, headMat);
enemyHead.position.y = 1.9;
enemyGroup.add(enemyHead);

// 敵キャラの顔
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const mouthMat = new THREE.MeshBasicMaterial({ color: 0xc0392b });

const leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.02), eyeMat);
leftEye.position.set(-0.2, 0.1, -0.41);
const rightEye = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.02), eyeMat);
rightEye.position.set(0.2, 0.1, -0.41);

const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.02), mouthMat);
mouth.position.set(0, -0.15, -0.41);

enemyHead.add(leftEye, rightEye, mouth);

// 相手の装備武器モデル
const enemyWeaponGroup = new THREE.Group();
enemyWeaponGroup.position.set(0.4, 0.7, -0.95); 
enemyGroup.add(enemyWeaponGroup);

const enemyWeaponMeshes = [];

// 0: ライフル
const rifleMesh = new THREE.Group();
rifleMesh.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 1.0), new THREE.MeshLambertMaterial({ color: 0x222222 })));
enemyWeaponMeshes.push(rifleMesh);

// 1: ショットガン
const sgMesh = new THREE.Group();
sgMesh.add(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.9), new THREE.MeshLambertMaterial({ color: 0x8B4513 })));
enemyWeaponMeshes.push(sgMesh);

// 2: スナイパー
const srMesh = new THREE.Group();
const srBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 1.4), new THREE.MeshLambertMaterial({ color: 0x2f4f4f }));
const srScope = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4), new THREE.MeshLambertMaterial({ color: 0x111111 }));
srScope.rotation.x = Math.PI / 2;
srScope.position.set(0, 0.1, 0);
srMesh.add(srBody, srScope);
enemyWeaponMeshes.push(srMesh);

// 3: サブマシンガン
const smgMesh = new THREE.Group();
smgMesh.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 0.55), new THREE.MeshLambertMaterial({ color: 0x444444 })));
enemyWeaponMeshes.push(smgMesh);

// 4: セミオート
const semiMesh = new THREE.Group();
semiMesh.add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.11, 1.1), new THREE.MeshLambertMaterial({ color: 0x111111 })));
enemyWeaponMeshes.push(semiMesh);

// 5: FAMAS
const famasMesh = new THREE.Group();
const famasBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.14, 0.8), new THREE.MeshLambertMaterial({ color: 0x333333 }));
const famasHandle = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.4), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
famasHandle.position.set(0, 0.1, -0.05);
famasMesh.add(famasBody, famasHandle);
enemyWeaponMeshes.push(famasMesh);

// 6: ナイフ
const knifeMesh = new THREE.Group();
const kBlade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.08, 0.35), new THREE.MeshLambertMaterial({ color: 0xcccccc }));
const kHandle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, 0.15), new THREE.MeshLambertMaterial({ color: 0x222222 }));
kHandle.position.z = 0.2;
knifeMesh.add(kBlade, kHandle);
enemyWeaponMeshes.push(knifeMesh);

let currentEnemyWeaponIdx = -1;
function updateEnemyWeapon(weaponIdx) {
    if (currentEnemyWeaponIdx === weaponIdx) return;
    currentEnemyWeaponIdx = weaponIdx;
    
    enemyWeaponMeshes.forEach(m => enemyWeaponGroup.remove(m));
    if (enemyWeaponMeshes[weaponIdx]) {
        enemyWeaponGroup.add(enemyWeaponMeshes[weaponIdx]);
    }
}

enemyGroup.position.set(0, -100, 0);

const practiceTargets = [];
function createPracticeTargets() {
    const targetPositions = [
        { x: -5, y: 2, z: 0 },
        { x: 0, y: 2.5, z: 5 },
        { x: 5, y: 1.8, z: -2 }
    ];

    targetPositions.forEach((pos, idx) => {
        const group = new THREE.Group();
        
        const outerGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.1, 32);
        const outerMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const outer = new THREE.Mesh(outerGeo, outerMat);
        outer.rotation.x = Math.PI / 2;
        group.add(outer);

        const innerGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.12, 32);
        const innerMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
        const inner = new THREE.Mesh(innerGeo, innerMat);
        inner.rotation.x = Math.PI / 2;
        group.add(inner);

        const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, pos.y, 16);
        const poleMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.y = -pos.y / 2;
        pole.rotation.x = 0;
        group.add(pole);

        group.position.set(pos.x, pos.y, pos.z);
        scene.add(group);
        
        outer.userData = { isTarget: true, inner: false, parentGroup: group };
        inner.userData = { isTarget: true, inner: true, parentGroup: group };
        practiceTargets.push(outer, inner);
    });
}

const bulletHoles = [];
const MAX_BULLET_HOLES = 50;

function createBulletHole(point, normal) {
    const holeGeo = new THREE.CircleGeometry(0.08, 12);
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide });
    const hole = new THREE.Mesh(holeGeo, holeMat);

    hole.position.copy(point).add(normal.clone().multiplyScalar(0.01));
    const lookAtPoint = point.clone().add(normal);
    hole.lookAt(lookAtPoint);

    scene.add(hole);
    bulletHoles.push(hole);

    if (bulletHoles.length > MAX_BULLET_HOLES) {
        const oldHole = bulletHoles.shift();
        scene.remove(oldHole);
        oldHole.geometry.dispose();
        oldHole.material.dispose();
    }
}

const player = {
    velocity: new THREE.Vector3(),
    speed: 15,
    jumpForce: 12,
    forwardBoost: 0,
    gravity: 30,
    isGrounded: false,
    isCrouching: false,
    isScoping: false,
    height: 1.6,
    crouchHeight: 0.8,
    pitch: 0,
    yaw: 0
};

const keys = { w: false, a: false, s: false, d: false };

function jump() {
    if (player.isGrounded && !player.isCrouching) {
        player.velocity.y = player.jumpForce;
        player.isGrounded = false;
        player.forwardBoost = 12;
    }
}

function crouch(isDown) {
    player.isCrouching = isDown;
    camera.position.y = isDown ? player.crouchHeight : player.height;
}

function toggleScope() {
    player.isScoping = !player.isScoping;
    const currentWeapon = WEAPONS[currentWeaponIdx];
    camera.fov = player.isScoping ? currentWeapon.scopeFov : 75;
    camera.updateProjectionMatrix();
}

function switchWeapon(index) {
    if (isReloading || index === currentWeaponIdx) return;
    isAutoShooting = false; 
    isBursting = false;
    currentWeaponIdx = index;
    if (player.isScoping) {
        camera.fov = WEAPONS[currentWeaponIdx].scopeFov;
        camera.updateProjectionMatrix();
    }
    updateWeaponDisplay();
}

function cycleWeapon() {
    switchWeapon((currentWeaponIdx + 1) % WEAPONS.length);
}

function reload() {
    const currentWeapon = WEAPONS[currentWeaponIdx];
    if (currentWeapon.maxAmmo === "∞" || isReloading || ammoList[currentWeaponIdx] === currentWeapon.maxAmmo) return;
    isReloading = true;
    isBursting = false;
    updateWeaponDisplay();
    setTimeout(() => {
        ammoList[currentWeaponIdx] = currentWeapon.maxAmmo;
        isReloading = false;
        updateWeaponDisplay();
    }, currentWeapon.reloadTime); 
}

function updateWeaponDisplay() {
    const currentWeapon = WEAPONS[currentWeaponIdx];
    document.getElementById('weapon-display').innerText = `${currentWeapon.name} (${currentWeaponIdx + 1})`;
    
    const ammoEl = document.getElementById('ammo-display');
    if (isReloading) {
        ammoEl.innerText = "Reloading...";
        ammoEl.classList.add('reloading');
    } else {
        if (currentWeapon.maxAmmo === "∞") {
            ammoEl.innerText = "∞";
        } else {
            ammoEl.innerText = `${ammoList[currentWeaponIdx]} / ${currentWeapon.maxAmmo}`;
        }
        ammoEl.classList.remove('reloading');
    }
}

const raycaster = new THREE.Raycaster();

function handleShootStart() {
    if(!isPlaying || isReloading || isBursting) return;
    const currentWeapon = WEAPONS[currentWeaponIdx];

    if (currentWeapon.isBurst) {
        triggerBurst();
        return;
    }
    
    if (currentWeapon.isAuto) {
        isAutoShooting = true;
    }
    shoot(); 
}

function handleShootEnd() {
    isAutoShooting = false;
}

function triggerBurst() {
    const currentWeapon = WEAPONS[currentWeaponIdx];
    const now = performance.now();
    if (now - lastShootTime < currentWeapon.fireRate - 5) return;
    if (ammoList[currentWeaponIdx] <= 0) return reload();

    isBursting = true;
    let fired = 0;

    function fireNext() {
        if (!isPlaying || isReloading || ammoList[currentWeaponIdx] <= 0 || fired >= currentWeapon.burstCount) {
            isBursting = false;
            lastShootTime = performance.now();
            return;
        }

        fireSingleBullet();
        fired++;

        if (fired < currentWeapon.burstCount && ammoList[currentWeaponIdx] > 0) {
            setTimeout(fireNext, currentWeapon.burstDelay || 70);
        } else {
            isBursting = false;
            lastShootTime = performance.now();
        }
    }

    fireNext();
}

function fireSingleBullet() {
    const currentWeapon = WEAPONS[currentWeaponIdx];

    if (currentWeapon.maxAmmo !== "∞") {
        ammoList[currentWeaponIdx]--;
    }
    updateWeaponDisplay();

    const flash = document.getElementById('flash-overlay');
    const crosshair = document.getElementById('crosshair');
    
    if (currentWeapon.maxAmmo !== "∞") {
        flash.style.opacity = 0.3;
        
        let recoil = 0.008;
        if (currentWeapon.name === "ショットガン") recoil = 0.025;
        else if (currentWeapon.name === "スナイパー") recoil = 0.035;
        else if (currentWeapon.name === "サブマシンガン") recoil = 0.004;
        else if (currentWeapon.name === "セミオート") recoil = 0.015;
        else if (currentWeapon.name.includes("FAMAS")) recoil = 0.001; // 下降量を大幅に小さく調整
        
        player.pitch -= recoil; // 元の向き（下）に戻し、FAMASのみ引き下げ幅を極小化
        player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));
    }
    crosshair.classList.add('shooting');
    
    setTimeout(() => {
        flash.style.opacity = 0;
        crosshair.classList.remove('shooting');
    }, 50);

    camera.rotation.set(player.pitch, player.yaw, 0);
    enemyGroup.updateMatrixWorld(true);

    let totalDamage = 0;
    let isEnemyHit = false;

    const targetsToRay = [floor, enemyHead, enemyBody, ...practiceTargets];

    for (let i = 0; i < currentWeapon.pellets; i++) {
        let screenPos = new THREE.Vector2(0, 0);
        
        if (currentWeapon.name !== "ナイフ" && !player.isScoping && currentWeapon.spread > 0) {
            screenPos.x += (Math.random() - 0.5) * currentWeapon.spread;
            screenPos.y += (Math.random() - 0.5) * currentWeapon.spread;
        }

        raycaster.setFromCamera(screenPos, camera);
        const intersects = raycaster.intersectObjects(targetsToRay, false);
        
        if (intersects.length > 0) {
            const hit = intersects[0];
            const hitObject = hit.object;

            if (currentWeapon.range && hit.distance > currentWeapon.range) {
                continue; 
            }

            if (hit.point && hit.face && currentWeapon.maxAmmo !== "∞") {
                createBulletHole(hit.point, hit.face.normal);
            }

            if (!isPracticeMode && (hitObject === enemyHead || hitObject === enemyBody)) {
                isEnemyHit = true;
                totalDamage += (hitObject === enemyHead) ? currentWeapon.headDamage : currentWeapon.bodyDamage;
            }
            
            if (hitObject.userData && hitObject.userData.isTarget) {
                crosshair.classList.add('hit-marker');
                setTimeout(() => crosshair.classList.remove('hit-marker'), 120);

                const damage = hitObject.userData.inner ? currentWeapon.headDamage : currentWeapon.bodyDamage;
                showTargetHitMessage(hitObject.userData.inner ? `BULLSEYE! -${damage}` : `HIT! -${damage}`);

                const group = hitObject.userData.parentGroup;
                group.position.z += 0.1;
                setTimeout(() => group.position.z -= 0.1, 50);
            }
        }
    }

    if (isEnemyHit && !isPracticeMode && totalDamage > 0) {
        crosshair.classList.add('hit-marker');
        setTimeout(() => crosshair.classList.remove('hit-marker'), 120);
        sendData({ type: 'hit', damage: totalDamage });
    }
}

function shoot() {
    if(!isPlaying || isReloading || isBursting) return;
    const currentWeapon = WEAPONS[currentWeaponIdx];

    if (currentWeapon.isBurst) {
        triggerBurst();
        return;
    }

    const now = performance.now();
    if (now - lastShootTime < currentWeapon.fireRate - 5) return; 

    if (currentWeapon.maxAmmo !== "∞") {
        if (ammoList[currentWeaponIdx] <= 0) {
            isAutoShooting = false; 
            return reload();
        }
    }
    
    lastShootTime = performance.now();
    fireSingleBullet();
}

function showTargetHitMessage(msg) {
    const el = document.getElementById('target-hit-msg');
    el.innerText = msg;
    el.style.opacity = 1;
    setTimeout(() => el.style.opacity = 0, 400);
}

function updateEnemyNameLabel() {
    if (!isPlaying || isPracticeMode) return;
    
    const enemyPos = enemyGroup.position.clone();
    enemyPos.y += 2.6;
    enemyPos.project(camera);

    const x = (enemyPos.x * .5 + .5) * window.innerWidth;
    const y = (enemyPos.y * -.5 + .5) * window.innerHeight;

    const label = document.getElementById('enemy-name-label');
    label.innerText = `${enemyName} (HP: ${Math.floor(enemyHP)})`;
    
    if (enemyPos.z < 1 && x > 0 && x < window.innerWidth && y > 0 && y < window.innerHeight) {
        label.style.display = 'block';
        label.style.left = `${x}px`;
        label.style.top = `${y}px`;
    } else {
        label.style.display = 'none';
    }
}

let prevTime = performance.now();

function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time - prevTime) / 1000;
    prevTime = time;

    if (isPlaying) {
        if (isAutoShooting) {
            shoot();
        }

        if (!isPracticeMode && myHP < 100 && myHP > 0) {
            if (time - lastDamageTime >= 6000) {
                myHP = Math.min(100, myHP + 10 * delta);
                document.getElementById('hp').innerText = Math.floor(myHP);
            }
        }

        player.velocity.y -= player.gravity * delta;

        let dirX = 0, dirZ = 0;
        if (isMobile) {
            dirX = moveInput.x;
            dirZ = moveInput.z;
        } else {
            dirZ = Number(keys.w) - Number(keys.s);
            dirX = Number(keys.a) - Number(keys.d);
            let len = Math.hypot(dirX, dirZ);
            if (len > 1) { dirX /= len; dirZ /= len; }
        }

        const moveSpeed = player.isCrouching ? player.speed * 0.4 : player.speed;

        if (dirX !== 0 || dirZ !== 0) {
            const angle = player.yaw;
            camera.position.x -= (Math.sin(angle) * dirZ + Math.cos(angle) * dirX) * moveSpeed * delta;
            camera.position.z -= (Math.cos(angle) * dirZ - Math.sin(angle) * dirX) * moveSpeed * delta;
        }

        if (player.forwardBoost > 0) {
            const fwdX = -Math.sin(player.yaw);
            const fwdZ = -Math.cos(player.yaw);
            camera.position.x += fwdX * player.forwardBoost * delta;
            camera.position.z += fwdZ * player.forwardBoost * delta;
            
            player.forwardBoost -= 40 * delta;
            if (player.forwardBoost < 0) player.forwardBoost = 0;
        }

        camera.position.y += player.velocity.y * delta;
        
        const currentGround = player.isCrouching ? player.crouchHeight : player.height;
        if (camera.position.y <= currentGround) {
            player.velocity.y = 0;
            camera.position.y = currentGround;
            player.isGrounded = true;
        }

        if (!isPracticeMode) {
            const modelY = camera.position.y - currentGround; 
            sendData({
                type: 'state',
                x: camera.position.x,
                y: modelY, 
                z: camera.position.z,
                yaw: player.yaw,
                crouch: player.isCrouching,
                hp: Math.floor(myHP),
                weapon: currentWeaponIdx
            });
            
            updateEnemyNameLabel();
        }
    }

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
