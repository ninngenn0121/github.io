<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>1vs1 3D FPS</title>
    <!-- 3D描画用ライブラリ Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 通信用ライブラリ PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; user-select: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        
        /* メニュー画面 */
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 100; }
        .menu-box { background: #222; padding: 30px; border-radius: 10px; text-align: center; border: 1px solid #555; max-width: 400px; width: 90%; }
        .menu-section { margin-bottom: 20px; padding: 15px; background: #333; border-radius: 8px; }
        input[type="text"] { padding: 10px; margin: 5px 0; border-radius: 4px; border: none; width: 80%; text-align: center; font-size: 16px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; background: #3498db; color: white; font-weight: bold; font-size: 16px; transition: 0.2s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #555; cursor: not-allowed; }
        .success-text { color: #2ecc71; font-weight: bold; display: none; margin-top: 10px; }

        /* ゲーム内UI */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); }
        #status { position: absolute; bottom: 20px; left: 20px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: red; opacity: 0; transition: opacity 0.1s; }

        /* モバイル用ボタン */
        .mobile-btn { position: absolute; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 50%; width: 60px; height: 60px; display: none; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; }
        .mobile-btn:active { background: rgba(255,255,255,0.5); }
        #btn-shoot { bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(231, 76, 60, 0.5); }
        #btn-jump { bottom: 130px; right: 30px; }
        #btn-crouch { bottom: 30px; right: 130px; }
        #btn-scope { bottom: 130px; right: 130px; }
        #mobile-joystick-area { position: absolute; top: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; display: none; }
        #mobile-look-area { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; pointer-events: auto; display: none; }
    </style>
</head>
<body>

<!-- メニュー画面 -->
<div id="menu">
    <div class="menu-box">
        <h2>3D FPS 対戦ロビー</h2>
        
        <div class="menu-section">
            <p>あなたのID</p>
            <h3 id="my-id" style="color: #f1c40f;">生成中...</h3>
            <button onclick="copyMyId()">IDをコピー</button>
        </div>

        <div class="menu-section">
            <p>対戦相手のIDを入力</p>
            <input type="text" id="peer-id-input" placeholder="例: user-xxxxxx">
            <button id="btn-connect" onclick="connectToPeer()">接続する</button>
            <div id="connection-status" class="success-text">通信を待機しています...</div>
        </div>

        <div class="menu-section" id="start-section" style="opacity: 0.5; pointer-events: none;">
            <p>接続完了！デバイスを選んでスタート</p>
            <button id="btn-pc" onclick="startGame(false)">PC (キーボード&マウス)</button>
            <button id="btn-mobile" onclick="startGame(true)">スマホ (タッチ操作)</button>
        </div>
    </div>
</div>

<!-- ゲーム画面UI -->
<div id="ui-layer">
    <div id="damage-overlay"></div>
    <div id="crosshair"></div>
    <div id="status">HP: <span id="hp">100</span></div>
    
    <div id="mobile-joystick-area"></div>
    <div id="mobile-look-area"></div>
    <div class="mobile-btn" id="btn-shoot">撃つ</div>
    <div class="mobile-btn" id="btn-jump">跳</div>
    <div class="mobile-btn" id="btn-crouch">屈</div>
    <div class="mobile-btn" id="btn-scope">覗</div>
</div>

<script>
// ==========================================
// 1. 基本設定とPeerJS通信（ロビー機能）
// ==========================================
let isMobile = false;
let isPlaying = false;
let myHP = 100;

let peer = null, conn = null;
let fixedPeerId = localStorage.getItem('game_3d_id') || ('user-' + Math.random().toString(36).substr(2, 6));
localStorage.setItem('game_3d_id', fixedPeerId);

// PeerJS初期化
peer = new Peer(fixedPeerId);
peer.on('open', id => {
    document.getElementById('my-id').innerText = id;
});
peer.on('error', err => { 
    console.error(err);
    alert("IDの生成に失敗しました。リロードしてください。"); 
});

// 相手から接続された時
peer.on('connection', connection => {
    if(conn) return connection.close(); // 既に繋がっていれば弾く
    conn = connection;
    setupConnection();
});

// 自分から接続する時（接続ボタンを押した時）
function connectToPeer() {
    const targetId = document.getElementById('peer-id-input').value.trim();
    if(!targetId) return alert("相手のIDを入力してください！");
    if(targetId === fixedPeerId) return alert("自分のIDです！");
    
    document.getElementById('btn-connect').innerText = "接続中...";
    conn = peer.connect(targetId);
    setupConnection();
}

// 接続成功時の共通処理
function setupConnection() {
    conn.on('open', () => {
        const statusEl = document.getElementById('connection-status');
        statusEl.style.display = 'block';
        statusEl.innerText = "★ 対戦相手と接続しました！ ★";
        document.getElementById('btn-connect').innerText = "接続完了";
        
        // スタートボタンを有効化
        const startSec = document.getElementById('start-section');
        startSec.style.opacity = "1";
        startSec.style.pointerEvents = "auto";
    });

    conn.on('data', data => {
        if (!isPlaying) return; // ゲーム開始前はデータを無視
        
        if (data.type === 'state') {
            enemyGroup.position.set(data.x, data.y, data.z);
            enemyGroup.rotation.y = data.yaw;
            if(data.crouch) {
                enemyBody.scale.y = 0.5;
                enemyHead.position.y = 1.0;
            } else {
                enemyBody.scale.y = 1;
                enemyHead.position.y = 1.9;
            }
        } else if (data.type === 'hit') {
            myHP -= data.damage;
            document.getElementById('hp').innerText = Math.max(0, myHP);
            
            const overlay = document.getElementById('damage-overlay');
            overlay.style.opacity = 0.5;
            setTimeout(() => overlay.style.opacity = 0, 100);

            if (myHP <= 0) {
                alert("YOU LOSE... 相手に倒されました");
                location.reload();
            }
        }
    });
}

function copyMyId() {
    navigator.clipboard.writeText(fixedPeerId).then(() => {
        alert("IDをコピーしました！相手に教えてあげてください。");
    });
}

// ==========================================
// 2. ゲームスタート処理
// ==========================================
function startGame(mobileMode) {
    isMobile = mobileMode;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'block';
    isPlaying = true;

    if (!isMobile) {
        // PC操作
        document.body.requestPointerLock();
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                player.yaw -= e.movementX * 0.002;
                player.pitch -= e.movementY * 0.002;
                player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));
                camera.rotation.set(player.pitch, player.yaw, 0);
            }
        });
        document.addEventListener('keydown', (e) => {
            if(e.code==='KeyW') keys.w = true;
            if(e.code==='KeyS') keys.s = true;
            if(e.code==='KeyA') keys.a = true;
            if(e.code==='KeyD') keys.d = true;
            if(e.code==='Space') jump();
            if(e.code==='ShiftLeft') crouch(true);
        });
        document.addEventListener('keyup', (e) => {
            if(e.code==='KeyW') keys.w = false;
            if(e.code==='KeyS') keys.s = false;
            if(e.code==='KeyA') keys.a = false;
            if(e.code==='KeyD') keys.d = false;
            if(e.code==='ShiftLeft') crouch(false);
        });
        document.addEventListener('mousedown', (e) => {
            if(e.button === 0) shoot();
            if(e.button === 2) toggleScope();
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
    } else {
        // モバイル操作
        document.querySelectorAll('.mobile-btn').forEach(b => b.style.display = 'flex');
        document.getElementById('mobile-joystick-area').style.display = 'block';
        document.getElementById('mobile-look-area').style.display = 'block';
        
        document.getElementById('btn-shoot').ontouchstart = () => shoot();
        document.getElementById('btn-jump').ontouchstart = () => jump();
        document.getElementById('btn-crouch').ontouchstart = () => crouch(!player.isCrouching);
        document.getElementById('btn-scope').ontouchstart = () => toggleScope();

        let lastTouchX = 0, lastTouchY = 0;
        document.getElementById('mobile-look-area').addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if(lastTouchX) {
                player.yaw -= (touch.clientX - lastTouchX) * 0.005;
                player.pitch -= (touch.clientY - lastTouchY) * 0.005;
                player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));
                camera.rotation.set(player.pitch, player.yaw, 0);
            }
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        });
        document.getElementById('mobile-look-area').addEventListener('touchend', () => { lastTouchX=0; lastTouchY=0; });

        document.getElementById('mobile-joystick-area').addEventListener('touchstart', () => keys.w = true);
        document.getElementById('mobile-joystick-area').addEventListener('touchend', () => keys.w = false);
    }
}

// ==========================================
// 3. Three.js セットアップ
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); 

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

const floorGeom = new THREE.PlaneGeometry(100, 100);
const floorMat = new THREE.MeshLambertMaterial({ color: 0x2E8B57 });
const floor = new THREE.Mesh(floorGeom, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// 障害物
const boxGeom = new THREE.BoxGeometry(4, 4, 4);
const boxMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
const obstacle = new THREE.Mesh(boxGeom, boxMat);
obstacle.position.set(0, 2, -10);
scene.add(obstacle);

// ==========================================
// 4. 敵プレイヤーモデル
// ==========================================
const enemyGroup = new THREE.Group();
scene.add(enemyGroup);

const bodyGeom = new THREE.BoxGeometry(1, 1.5, 1);
const bodyMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
const enemyBody = new THREE.Mesh(bodyGeom, bodyMat);
enemyBody.position.y = 0.75;
enemyGroup.add(enemyBody);

const headGeom = new THREE.BoxGeometry(0.8, 0.8, 0.8);
const headMat = new THREE.MeshLambertMaterial({ color: 0xf1c40f });
const enemyHead = new THREE.Mesh(headGeom, headMat);
enemyHead.position.y = 1.9;
enemyGroup.add(enemyHead);

enemyGroup.position.set(0, -100, 0);

// ==========================================
// 5. プレイヤーの移動・アクション
// ==========================================
const player = {
    velocity: new THREE.Vector3(),
    direction: new THREE.Vector3(),
    speed: 10,
    jumpForce: 12,
    gravity: 30,
    isGrounded: false,
    isCrouching: false,
    isScoping: false,
    height: 1.6,
    crouchHeight: 0.8,
    pitch: 0,
    yaw: 0
};

camera.position.set(0, player.height, 5);
camera.rotation.order = 'YXZ';

const keys = { w: false, a: false, s: false, d: false };

function jump() {
    if (player.isGrounded && !player.isCrouching) {
        player.velocity.y = player.jumpForce;
        player.isGrounded = false;
    }
}

function crouch(isDown) {
    player.isCrouching = isDown;
    camera.position.y = isDown ? player.crouchHeight : player.height;
}

function toggleScope() {
    player.isScoping = !player.isScoping;
    camera.fov = player.isScoping ? 30 : 75;
    camera.updateProjectionMatrix();
}

const raycaster = new THREE.Raycaster();
function shoot() {
    if(!isPlaying) return;
    
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObjects([enemyHead, enemyBody]);
    
    if (intersects.length > 0) {
        const hitObject = intersects[0].object;
        let damage = hitObject === enemyHead ? 50 : 15;
        if (conn && conn.open) {
            conn.send({ type: 'hit', damage: damage });
        }
    }
}

// ==========================================
// 6. メインループ
// ==========================================
let prevTime = performance.now();

function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time - prevTime) / 1000;
    prevTime = time;

    if (isPlaying) {
        player.velocity.y -= player.gravity * delta;

        player.direction.z = Number(keys.w) - Number(keys.s);
        player.direction.x = Number(keys.a) - Number(keys.d);
        player.direction.normalize();

        const moveSpeed = player.isCrouching ? player.speed * 0.4 : player.speed;

        if (player.direction.z !== 0 || player.direction.x !== 0) {
            const angle = player.yaw;
            camera.position.x -= (Math.sin(angle) * player.direction.z + Math.cos(angle) * player.direction.x) * moveSpeed * delta;
            camera.position.z -= (Math.cos(angle) * player.direction.z - Math.sin(angle) * player.direction.x) * moveSpeed * delta;
        }

        camera.position.y += player.velocity.y * delta;
        
        const currentGround = player.isCrouching ? player.crouchHeight : player.height;
        if (camera.position.y <= currentGround) {
            player.velocity.y = 0;
            camera.position.y = currentGround;
            player.isGrounded = true;
        }

        if (conn && conn.open) {
            conn.send({
                type: 'state',
                x: camera.position.x,
                y: camera.position.y - currentGround,
                z: camera.position.z,
                yaw: player.yaw,
                crouch: player.isCrouching
            });
        }
    }

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
