<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1vs1 オンラインシューティング</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }
        #canvas-container {
            position: relative;
        }
        canvas {
            background-color: #2b2b2b;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            display: flex;
            gap: 30px;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 4px #000;
        }
        #countdown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .reload-btn {
            padding: 5px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .reload-btn:hover { background-color: #c0392b; }
        input, select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 5px 10px; cursor: pointer; border-radius: 4px; border: none; background: #3498db; color: white; font-weight: bold; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div id="controls">
        <label>名前: <input type="text" id="name-input" value="Player1" maxlength="10" style="width: 80px;"></label>
        <label>武器: 
            <select id="weapon-select">
                <option value="AR">アサルトライフル</option>
                <option value="SG">ショットガン(散乱弾)</option>
                <option value="SR">スナイパーライフル</option>
            </select>
        </label>
        <span>固定ID: <strong id="my-id">生成中...</strong></span>
        <input type="text" id="peer-id-input" placeholder="対戦相手のIDを入力">
        <button id="connect-btn">対戦相手に接続</button>
        <button class="reload-btn" onclick="reload()">RELOAD (R)</button>
    </div>

    <div id="canvas-container">
        <div id="ui">
            <div>HP: <span id="hp-display">100</span></div>
            <div>弾薬: <span id="ammo-display">30 / 30</span></div>
        </div>
        <div id="countdown-overlay"></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const countdownEl = document.getElementById('countdown-overlay');

// --- 武器パラメータ設定 ---
const WEAPONS = {
    AR: { name: "アサルトライフル", maxAmmo: 30, shootInterval: 150, bulletSpeed: 22, damage: 10, spread: 0.05, count: 1, reloadTime: 1500 },
    SG: { name: "ショットガン",     maxAmmo: 8,  shootInterval: 800, bulletSpeed: 18, damage: 8,  spread: 0.25, count: 5, reloadTime: 2000 },
    SR: { name: "スナイパー",       maxAmmo: 5,  shootInterval: 1200,bulletSpeed: 35, damage: 50, spread: 0.00, count: 1, reloadTime: 2500 }
};

let currentWeapon = WEAPONS.AR;

// --- プレイヤーデータ ---
let peer = null;
let conn = null;
let gameState = 'WAITING'; // WAITING (ソロ練習), COUNTDOWN, PLAYING, FINISHED
let isEndingGame = false; // 勝敗判定中のフラグ

// ブラウザのlocalStorageに固定IDを保存
let fixedPeerId = localStorage.getItem('game_fixed_peer_id');
if (!fixedPeerId) {
    fixedPeerId = 'user-' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('game_fixed_peer_id', fixedPeerId);
}

const myPlayer = {
    x: 100, y: 300, size: 20, color: '#3498db',
    hp: 100, speed: 4, angle: 0,
    ammo: 30, isReloading: false,
    name: "Player1"
};

const enemyPlayer = {
    x: 700, y: 300, size: 20, color: '#e74c3c',
    hp: 100, angle: 0,
    name: "Enemy", isConnected: false
};

let bullets = [];
const keys = {};
let mousePos = { x: 0, y: 0 };
let isMouseDown = false;
let lastShootTime = 0;

// イベントリスナー
document.getElementById('name-input').addEventListener('input', (e) => {
    myPlayer.name = e.target.value || "No Name";
});

document.getElementById('weapon-select').addEventListener('change', (e) => {
    currentWeapon = WEAPONS[e.target.value];
    myPlayer.ammo = currentWeapon.maxAmmo;
    updateUI();
});

// --- PeerJS (オンライン通信) ---
function initPeer() {
    peer = new Peer(fixedPeerId);

    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
    });

    peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
            const tempId = fixedPeerId + '-' + Math.floor(Math.random()*1000);
            peer = new Peer(tempId);
            peer.on('open', (id) => document.getElementById('my-id').innerText = id);
        }
    });

    peer.on('connection', (connection) => {
        if (conn && conn.open) {
            connection.on('open', () => {
                connection.send({ type: 'reject', reason: '満員です（1vs1専用）' });
                setTimeout(() => connection.close(), 500);
            });
            return;
        }

        conn = connection;
        setupConnection(false);
    });
}

document.getElementById('connect-btn').addEventListener('click', () => {
    if (conn && conn.open) return;
    const peerId = document.getElementById('peer-id-input').value;
    if (peerId) {
        conn = peer.connect(peerId);
        setupConnection(true);
    }
});

function setupConnection(isClient) {
    conn.on('open', () => {
        enemyPlayer.isConnected = true;
        isEndingGame = false;
        bullets = []; // 練習時の弾を消去
        
        if (isClient) {
            myPlayer.x = 700; myPlayer.color = '#e74c3c';
            enemyPlayer.x = 100; enemyPlayer.color = '#3498db';
        } else {
            myPlayer.x = 100; myPlayer.color = '#3498db';
            enemyPlayer.x = 700; enemyPlayer.color = '#e74c3c';
        }
        
        startCountdown();
    });

    conn.on('data', (data) => {
        if (data.type === 'state') {
            enemyPlayer.x = data.x;
            enemyPlayer.y = data.y;
            enemyPlayer.angle = data.angle;
            enemyPlayer.hp = data.hp;
            enemyPlayer.name = data.name;
        } else if (data.type === 'shoot') {
            bullets.push(...data.bullets);
        } else if (data.type === 'gameover') {
            // 相手側からゲーム終了通知が届いた場合（相手が撃破された＝自分が勝利）
            if (!isEndingGame) {
                isEndingGame = true;
                gameState = 'FINISHED';
                setTimeout(() => {
                    alert("YOU WIN! 🎉 相手を撃破しました！");
                    resetToWaiting();
                }, 100);
            }
        } else if (data.type === 'reject') {
            alert(data.reason);
            conn = null;
        }
    });

    conn.on('close', () => {
        // ゲーム終了時以外の不意の切断時のみ警告を表示
        if (!isEndingGame && gameState === 'PLAYING') {
            alert("対戦相手が通信を切断しました。");
        }
        resetToWaiting();
    });
}

function resetToWaiting() {
    gameState = 'WAITING';
    enemyPlayer.isConnected = false;
    isEndingGame = false;
    if (conn) {
        conn.close();
        conn = null;
    }
    myPlayer.hp = 100;
    myPlayer.ammo = currentWeapon.maxAmmo;
    updateUI();
}

// カウントダウン処理
function startCountdown() {
    gameState = 'COUNTDOWN';
    myPlayer.hp = 100;
    myPlayer.ammo = currentWeapon.maxAmmo;
    updateUI();

    let count = 3;
    countdownEl.innerText = count;

    const timer = setInterval(() => {
        count--;
        if (count > 0) {
            countdownEl.innerText = count;
        } else if (count === 0) {
            countdownEl.innerText = "START!";
        } else {
            countdownEl.innerText = "";
            gameState = 'PLAYING';
            clearInterval(timer);
        }
    }, 1000);
}

// --- 入力処理 ---
window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'r') reload();
});
window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', (e) => { if (e.button === 0) isMouseDown = true; });
canvas.addEventListener('mouseup', (e) => { if (e.button === 0) isMouseDown = false; });

function reload() {
    if (myPlayer.isReloading || myPlayer.ammo === currentWeapon.maxAmmo || gameState === 'COUNTDOWN') return;
    myPlayer.isReloading = true;
    document.getElementById('ammo-display').innerText = "リロード中...";
    
    setTimeout(() => {
        myPlayer.ammo = currentWeapon.maxAmmo;
        myPlayer.isReloading = false;
        updateUI();
    }, currentWeapon.reloadTime);
}

function shoot() {
    // COUNTDOWN中だけ射撃不可（WAITING中とPLAYING中は可能）
    if (gameState === 'COUNTDOWN') return;
    
    const now = Date.now();
    if (now - lastShootTime < currentWeapon.shootInterval) return;
    if (myPlayer.ammo <= 0 || myPlayer.isReloading) return;

    myPlayer.ammo--;
    lastShootTime = now;
    updateUI();

    const newBullets = [];
    for (let i = 0; i < currentWeapon.count; i++) {
        const spreadAngle = (Math.random() - 0.5) * currentWeapon.spread;
        const finalAngle = myPlayer.angle + spreadAngle;

        const bullet = {
            x: myPlayer.x + Math.cos(myPlayer.angle) * myPlayer.size,
            y: myPlayer.y + Math.sin(myPlayer.angle) * myPlayer.size,
            vx: Math.cos(finalAngle) * currentWeapon.bulletSpeed,
            vy: Math.sin(finalAngle) * currentWeapon.bulletSpeed,
            damage: currentWeapon.damage,
            owner: peer.id
        };
        newBullets.push(bullet);
    }

    bullets.push(...newBullets);

    if (conn && conn.open && gameState === 'PLAYING') {
        conn.send({ type: 'shoot', bullets: newBullets });
    }
}

function updateUI() {
    document.getElementById('hp-display').innerText = Math.max(0, myPlayer.hp);
    if (!myPlayer.isReloading) {
        document.getElementById('ammo-display').innerText = `${myPlayer.ammo} / ${currentWeapon.maxAmmo}`;
    }
}

// --- メインループ ---
function update() {
    // WAITING（ソロ練習）または PLAYING（対戦中）の時に移動可能
    if (gameState === 'WAITING' || gameState === 'PLAYING') {
        if (keys['w'] && myPlayer.y > myPlayer.size) myPlayer.y -= myPlayer.speed;
        if (keys['s'] && myPlayer.y < canvas.height - myPlayer.size) myPlayer.y += myPlayer.speed;
        if (keys['a'] && myPlayer.x > myPlayer.size) myPlayer.x -= myPlayer.speed;
        if (keys['d'] && myPlayer.x < canvas.width - myPlayer.size) myPlayer.x += myPlayer.speed;

        if (isMouseDown) shoot();
    }

    // エイム角度計算
    myPlayer.angle = Math.atan2(mousePos.y - myPlayer.y, mousePos.x - myPlayer.x);

    // オンラインデータ送信
    if (conn && conn.open && gameState === 'PLAYING') {
        conn.send({
            type: 'state',
            x: myPlayer.x, y: myPlayer.y, angle: myPlayer.angle,
            hp: myPlayer.hp, name: myPlayer.name
        });
    }

    // 弾移動＆被弾判定
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // 画面外で消滅
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        // 対戦相手からの攻撃が自分にヒットした判定（PLAYING中のみ）
        if (b.owner !== peer.id && gameState === 'PLAYING') {
            const dist = Math.hypot(b.x - myPlayer.x, b.y - myPlayer.y);
            if (dist < myPlayer.size) {
                myPlayer.hp -= b.damage;
                updateUI();
                bullets.splice(i, 1);

                // 自分が倒された場合（敗北処理）
                if (myPlayer.hp <= 0 && !isEndingGame) {
                    isEndingGame = true;
                    gameState = 'FINISHED';

                    // 相手にゲームオーバー（自分が倒された）イベントを通知
                    if (conn && conn.open) {
                        conn.send({ type: 'gameover', winner: 'enemy' });
                    }

                    setTimeout(() => {
                        alert("YOU LOSE... 倒されました。");
                        resetToWaiting();
                    }, 100);
                }
            }
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 相手プレイヤー（接続中のみ）
    if (enemyPlayer.isConnected) {
        drawPlayer(enemyPlayer.x, enemyPlayer.y, enemyPlayer.angle, enemyPlayer.color, enemyPlayer.name);
    }

    // 自分プレイヤー
    drawPlayer(myPlayer.x, myPlayer.y, myPlayer.angle, myPlayer.color, myPlayer.name);

    // 弾描画
    ctx.fillStyle = '#f1c40f';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawPlayer(x, y, angle, color, name) {
    ctx.save();
    
    // 頭上の名前
    ctx.font = 'bold 14px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000000';
    ctx.shadowBlur = 4;
    ctx.fillText(name, x, y - 30);

    ctx.translate(x, y);
    ctx.rotate(angle);

    // 本体
    ctx.shadowBlur = 0;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fill();

    // 銃身
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(10, -3, 20, 6);

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initPeer();
gameLoop();
</script>
</body>
</html>
