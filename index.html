<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1vs1 オンラインシューティング</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        canvas {
            background-color: #2b2b2b;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
        }
        .reload-btn {
            padding: 5px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .reload-btn:hover { background-color: #c0392b; }
        input { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 5px 10px; cursor: pointer; border-radius: 4px; border: none; background: #3498db; color: white; font-weight: bold; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div id="controls">
        <label>名前: <input type="text" id="name-input" value="Player1" maxlength="10" style="width: 80px;"></label>
        <span>あなたのID: <strong id="my-id">接続中...</strong></span>
        <input type="text" id="peer-id-input" placeholder="対戦相手のIDを入力">
        <button id="connect-btn">対戦相手に接続</button>
        <button class="reload-btn" onclick="reload()">RELOAD (R)</button>
    </div>

    <div id="ui">
        <div>HP: <span id="hp-display">100</span></div>
        <div>弾薬: <span id="ammo-display">30</span> / 30</div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- プレイヤー＆ゲームデータ ---
let peer = null;
let conn = null;

const myPlayer = {
    x: 100, y: 300, size: 20, color: '#3498db',
    hp: 100, speed: 4, angle: 0,
    ammo: 30, maxAmmo: 30, isReloading: false,
    name: "Player1"
};

const enemyPlayer = {
    x: 700, y: 300, size: 20, color: '#e74c3c',
    hp: 100, angle: 0,
    name: "Enemy", isConnected: false
};

let bullets = [];
const keys = {};
let mousePos = { x: 0, y: 0 };
let isMouseDown = false;
let lastShootTime = 0;
const shootInterval = 100; // 連射速度 (ms)

// 名前変更の監視
document.getElementById('name-input').addEventListener('input', (e) => {
    myPlayer.name = e.target.value || "No Name";
});

// --- PeerJS (通信＆1vs1制限) ---
function initPeer() {
    peer = new Peer();

    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
    });

    // 他人からの接続要求
    peer.on('connection', (connection) => {
        // すでに誰かと対戦中（connが存在して通信可能）なら3人目を自動拒否
        if (conn && conn.open) {
            connection.on('open', () => {
                connection.send({ type: 'reject', reason: 'ルームが満員です（1vs1専用）' });
                setTimeout(() => connection.close(), 500);
            });
            return;
        }

        conn = connection;
        setupConnection();
        // 接続を受けた側 (2P) の初期配置
        myPlayer.x = 700;
        myPlayer.color = '#e74c3c';
        enemyPlayer.x = 100;
        enemyPlayer.color = '#3498db';
    });
}

// 自分から接続を仕掛ける (1P)
document.getElementById('connect-btn').addEventListener('click', () => {
    if (conn && conn.open) {
        alert("すでに誰かと接続中です。");
        return;
    }
    const peerId = document.getElementById('peer-id-input').value;
    if (peerId) {
        conn = peer.connect(peerId);
        setupConnection();
    }
});

function setupConnection() {
    conn.on('open', () => {
        enemyPlayer.isConnected = true;
        console.log("対戦相手と接続されました！");
    });

    conn.on('data', (data) => {
        if (data.type === 'state') {
            enemyPlayer.x = data.x;
            enemyPlayer.y = data.y;
            enemyPlayer.angle = data.angle;
            enemyPlayer.hp = data.hp;
            enemyPlayer.name = data.name; // 相手の名前を同期
        } else if (data.type === 'shoot') {
            bullets.push(data.bullet);
        } else if (data.type === 'reject') {
            alert(data.reason);
            conn = null;
            enemyPlayer.isConnected = false;
        }
    });

    conn.on('close', () => {
        alert("対戦相手が切断しました。");
        enemyPlayer.isConnected = false;
        conn = null;
    });
}

// --- 入力判定 ---
window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'r') reload();
});
window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', (e) => { if (e.button === 0) isMouseDown = true; });
canvas.addEventListener('mouseup', (e) => { if (e.button === 0) isMouseDown = false; });

// --- アクション機能 ---
function reload() {
    if (myPlayer.isReloading || myPlayer.ammo === myPlayer.maxAmmo) return;
    myPlayer.isReloading = true;
    document.getElementById('ammo-display').innerText = "リロード中...";
    
    setTimeout(() => {
        myPlayer.ammo = myPlayer.maxAmmo;
        myPlayer.isReloading = false;
        updateUI();
    }, 1500);
}

function shoot() {
    const now = Date.now();
    if (now - lastShootTime < shootInterval) return;
    if (myPlayer.ammo <= 0 || myPlayer.isReloading) return;

    myPlayer.ammo--;
    lastShootTime = now;
    updateUI();

    const bullet = {
        x: myPlayer.x + Math.cos(myPlayer.angle) * myPlayer.size,
        y: myPlayer.y + Math.sin(myPlayer.angle) * myPlayer.size,
        vx: Math.cos(myPlayer.angle) * 12,
        vy: Math.sin(myPlayer.angle) * 12,
        owner: peer.id
    };

    bullets.push(bullet);

    if (conn && conn.open) {
        conn.send({ type: 'shoot', bullet: bullet });
    }
}

function updateUI() {
    document.getElementById('hp-display').innerText = Math.max(0, myPlayer.hp);
    if (!myPlayer.isReloading) {
        document.getElementById('ammo-display').innerText = myPlayer.ammo;
    }
}

// --- メインゲームループ ---
function update() {
    // 移動
    if (keys['w'] && myPlayer.y > myPlayer.size) myPlayer.y -= myPlayer.speed;
    if (keys['s'] && myPlayer.y < canvas.height - myPlayer.size) myPlayer.y += myPlayer.speed;
    if (keys['a'] && myPlayer.x > myPlayer.size) myPlayer.x -= myPlayer.speed;
    if (keys['d'] && myPlayer.x < canvas.width - myPlayer.size) myPlayer.x += myPlayer.speed;

    // 角度計算
    myPlayer.angle = Math.atan2(mousePos.y - myPlayer.y, mousePos.x - myPlayer.x);

    // 射撃
    if (isMouseDown) shoot();

    // 自分の最新状態（名前含む）を送信
    if (conn && conn.open) {
        conn.send({
            type: 'state',
            x: myPlayer.x,
            y: myPlayer.y,
            angle: myPlayer.angle,
            hp: myPlayer.hp,
            name: myPlayer.name
        });
    }

    // 弾の判定
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        if (b.owner !== peer.id) {
            const dist = Math.hypot(b.x - myPlayer.x, b.y - myPlayer.y);
            if (dist < myPlayer.size) {
                myPlayer.hp -= 10;
                updateUI();
                bullets.splice(i, 1);

                if (myPlayer.hp <= 0) {
                    alert("敗北しました...");
                    location.reload();
                }
            }
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 相手プレイヤー描画（接続中のみ）
    if (enemyPlayer.isConnected) {
        drawPlayer(enemyPlayer.x, enemyPlayer.y, enemyPlayer.angle, enemyPlayer.color, enemyPlayer.name);
    }

    // 自分プレイヤー描画
    drawPlayer(myPlayer.x, myPlayer.y, myPlayer.angle, myPlayer.color, myPlayer.name);

    // 弾描画
    ctx.fillStyle = '#f1c40f';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawPlayer(x, y, angle, color, name) {
    ctx.save();
    
    // --- 名前の描画（頭上） ---
    ctx.font = 'bold 14px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000000';
    ctx.shadowBlur = 4;
    ctx.fillText(name, x, y - 30); // プレイヤーの少し上

    // --- 本体＆武器の回転描画 ---
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 本体（円）
    ctx.shadowBlur = 0; // 影をリセット
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fill();

    // アサルトライフル
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(10, -3, 20, 6);

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// 起動
initPeer();
gameLoop();
</script>
</body>
</html>
